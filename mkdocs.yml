site_name: Watao Docs
site_url: https://watao56.github.io/watao-docs/
site_description: watao56のドキュメントサイト
site_author: watao56

theme:
  name: material
  language: ja
  palette:
    scheme: slate
    primary: custom
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - navigation.instant
    - navigation.tracking
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/file-document

extra_css:
  - stylesheets/custom.css

nav:
  - ホーム: index.md
  - 📚 調査メモ: research/index.md
  - 🛠️ 技術ノート:
