  language: ja
  palette:
    scheme: slate
    primary: custom
    accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.prune
    - search.highlight
    - search.suggest
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - toc.integrate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/file-document

extra_css:
