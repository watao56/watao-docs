      - 🛡️ DepsFence:
        - 設計書: ideas/depsfence.md
        - レビュー: ideas/depsfence-review.md
      - 💾 BackupHero:
        - 設計書: ideas/backuphero.md
        - レビュー: ideas/backuphero-review.md
    - ⏰ CronFailsafe:
      - 設計書: ideas/cron-failsafe.md
      - レビュー: ideas/cron-failsafe-review.md
    - 📋 ContractAlert:
